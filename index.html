<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>External Trackpad</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      touch-action: none;
      user-select: none;
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #121212;
      overflow: hidden;
    }
    #status {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 16px;
      border-radius: 20px;
      background: #2a2a2a;
      color: #888;
      font-size: 14px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      z-index: 10;
      transition: all 0.3s ease;
    }
    #status.connected {
      background: #1b4332;
      color: #52b788;
    }
    #pad {
      width: 100vw;
      height: 100vh;
      background: #181818;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 1.2rem;
      position: relative;
    }
    .touch-ripple {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      transform: translate(-50%, -50%) scale(1);
      pointer-events: none;
      animation: ripple-fade 0.3s ease-out forwards;
    }
    @keyframes ripple-fade {
      to {
        transform: translate(-50%, -50%) scale(2);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div id="status">Connecting...</div>
  <div id="pad">Trackpad Active</div>

  <script>
    const socket = io();
    const pad = document.getElementById('pad');
    const statusEl = document.getElementById('status');

    let lastX = 0, lastY = 0;
    let isTap = false;
    let touchStartTime = 0;
    let lastScrollY = 0;

    // Connection status updates
    socket.on('connect', () => {
      statusEl.textContent = 'Connected to Mac';
      statusEl.classList.add('connected');
    });

    socket.on('disconnect', () => {
      statusEl.textContent = 'Disconnected';
      statusEl.classList.remove('connected');
    });

    function triggerHaptic() {
      if ('vibrate' in navigator) navigator.vibrate(12);
    }

    function createRipple(x, y) {
      const ripple = document.createElement('div');
      ripple.className = 'touch-ripple';
      ripple.style.left = `${x}px`;
      ripple.style.top = `${y}px`;
      pad.appendChild(ripple);
      setTimeout(() => ripple.remove(), 300);
    }

    pad.addEventListener('touchstart', (e) => {
      e.preventDefault(); 
      const touchCount = e.touches.length;

      for (let i = 0; i < e.changedTouches.length; i++) {
        createRipple(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
      }
      triggerHaptic();

      if (touchCount === 1) {
        const touch = e.touches[0];
        lastX = touch.clientX;
        lastY = touch.clientY;
        isTap = true;
        touchStartTime = Date.now();
      } else if (touchCount === 2) {
        isTap = false;
        lastScrollY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      }
    }, { passive: false });

    pad.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const touchCount = e.touches.length;

      if (touchCount === 1) {
        // 1 FINGER: MOUSE MOVE
        const touch = e.touches[0];
        const dx = touch.clientX - lastX;
        const dy = touch.clientY - lastY;

        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
          isTap = false;
        }

        socket.emit('move', { dx, dy });
        lastX = touch.clientX;
        lastY = touch.clientY;

      } else if (touchCount === 2) {
        // 2 FINGERS: VERTICAL SCROLL ONLY
        const currentY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        const dy = currentY - lastScrollY;

        if (Math.abs(dy) > 2) {
          socket.emit('scroll', { dy: dy * -1 });
          lastScrollY = currentY;
        }
      }
    }, { passive: false });

    pad.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        const duration = Date.now() - touchStartTime;
        if (isTap && duration < 200) {
          socket.emit('click');
        }
        isTap = false;
      }
    });

    pad.addEventListener('touchcancel', () => {
      isTap = false;
    });
  </script>
</body>
</html>
